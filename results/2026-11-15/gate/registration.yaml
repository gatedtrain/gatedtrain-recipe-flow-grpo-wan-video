# Area "video generation" pre-registration: Flow-GRPO + LoRA on Wan2.1-T2V-1.3B against the base alone, OCR text
# rendering in video (MULTIMODAL-SPEC row 3 and its deviations).
# prototype, unpromotable. Unsigned: no named team has signed it. Values fixed after the smoke run and before the full
# run started. Deciding T3 metric `ocr_b_acc` (docTR, best-matching-substring edit distance,
# mean over all 17 frames, zero frames included; higher is better; [0, 1]), blocking, construct-aligned with the
# PaddleOCR video_ocr reward (R15-1); superiority with margin 0; alpha 0.025 one-sided, power 0.8, m = 1; N 400, K 1,
# eval seed 11. sigma_plan fixed 0.20 = max(1.5 x ucb80(s_pilot), sqrt(2) x ucb80(s_base)) from the smoke (s_pilot
# 0.0850 = SD of 40 paired differences, smoke cut 2 minus the base; s_base 0.1266; ucb80 with 39 df factor 1.1137:
# 0.0947, 0.1410; 1.5 x 0.0947 = 0.142, sqrt(2) x 0.1410 = 0.1994, rounded up). Planning effect 0.03: n_required =
# ceil(((1.95996 + 0.84162) x 0.20 / 0.03)^2) = 349 <= 400 (MDE at N 400: 0.028). ocr_a_acc (PaddleOCR, the reward's
# formula, T0) is reported only (t2v.wan_ocr_paddle_items@0.1, not gating). Any later change is an amendment: a new
# registration with `amends` and a new hash in spec.yaml (05:166).
registration_version: 1
registration_id: mm-a3-video-ocr-superiority-v1
signed_by: prototype-unsigned
created_at: "2026-11-15T00:57:50Z"
workflow: mm-a3-video-flow-grpo-wan
gate: quality_gate
clause:
  type: superiority
  metric: ocr_b_acc
  direction: higher_is_better
  margin: 0.0
  alpha: 0.025
  power: 0.8
  planning_effect: 0.03
  sigma_plan: fixed
  unit: item
  samples_per_item: 1
  eval_seeds: [11]
  interval: cluster_bootstrap
  blocking: true
margin_justification: >-
  Superiority with delta_sup = 0: any held-out gain of mean docTR OCR accuracy over the base video model counts.
  Prototype value, not reviewed by a named team.
sigma_pilot:
  sigma: 0.20
  source: >-
    GPU smoke (records/area3-video/train-smoke-1, eval-smoke-base-1, eval-smoke-cut-1): the first 40 registered items,
    seed 11, the deployment sampler (Euler ODE 20 steps, CFG 4.5, 240x416, 17 frames). Paired differences of
    ocr_b_acc, smoke cut 2 (4 optimizer steps) minus the base: mean +0.001, SD 0.0850; base item SD 0.1266.
    sigma_plan = max(1.5 x ucb80(0.0850), sqrt(2) x ucb80(0.1266)) = 0.1994, rounded up to 0.20.
baseline_pilot_mean: 0.175    # base, first 40 items (sd 0.127, none at 0); the 20-item render probe gave 0.169
construct_alignment: >-
  ocr_b_acc measures the construct of the training reward video_ocr_paddleocr (the prompt's quoted text is legibly
  rendered in the video) with another OCR engine (docTR db_resnet50 + crnn_vgg16_bn, not PaddleOCR PP-OCRv4), another
  formula (edit distance of the best-matching substring of the recognized text) and another aggregate (the mean over
  all 17 frames, frames that read nothing included, not the mean of the positive scores of every 4th frame). A pass
  shows that the reward's gain transfers to an independent OCR engine over the whole clip, not that the videos are
  better otherwise (motion, fidelity and prompt adherence beyond the text are not measured).
eval_distribution:
  item_set_hash: "sha256:0b01553c4c74ef18c9954dca686c8edc00b18e20e3d43346265858303d8ad4a7"   # manifest of area3-video/items/ (byte copy of area 5's)
# The deployment sampler (every cut's sampler.json; eval_videos.py uses it unchanged).
